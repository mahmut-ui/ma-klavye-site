<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MA_KLAVYE | Resmî İndirme Merkezi</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .kart {
            width: 100%;
            max-width: 650px;
            padding: 45px 25px;
            text-align: center;
            background: #151e33;
            border: 1px solid #293958;
            border-radius: 24px;
            box-shadow: 0 15px 50px #0005;
        }

        .logo {
            width: 85px;
            height: 85px;
            margin: auto;
            border-radius: 22px;
            background: #18c878;
            color: #071b12;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
        }

        h1 {
            font-size: 35px;
            margin-bottom: 10px;
        }

        .aciklama {
            color: #bdc9df;
            line-height: 1.7;
        }

        .indir {
            display: inline-block;
            margin-top: 22px;
            padding: 17px 27px;
            background: #18c878;
            color: #06170e;
            font-weight: bold;
            text-decoration: none;
            border-radius: 12px;
        }

        .indir:hover {
            background: #42e89a;
        }

        .bilgi {
            margin-top: 28px;
            padding: 15px;
            background: #0d1629;
            border-radius: 12px;
            color: #bdc9df;
            line-height: 1.8;
        }

        footer {
            margin-top: 25px;
            font-size: 12px;
            color: #8392ad;
        }
    </style>
</head>

<body>
    <main class="kart">

        <div class="logo">MA</div>

        <h1>MA_KLAVYE</h1>

        <p class="aciklama">
            Arduino destekli klavye projesi için
            resmî indirme merkezine hoş geldin!
        </p>

        <div class="bilgi">
            <strong>Windows desteği</strong><br>
            Yardımcı program ve kurulum dosyaları<br>
            Arduino UNO uyumluluğu
        </div>

        <a class="indir"
           href="https://github.com/"
           target="_blank"
           rel="noopener noreferrer">
            İNDİRME MERKEZİ
        </a>

        <footer>
            MA_KLAVYE • Resmî İndirme Merkezi
        </footer>

    </main>
</body>
</html>
